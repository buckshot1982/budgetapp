<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Finance Command Center</title>
<meta name="theme-color" content="#0f172a" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root {
    --bg: #0f172a;
    --card: #1a2740;
    --border: #2a3b57;
    --text: #f1f5f9;
    --text-dim: #94a3b8;
    --gold: #f59e0b;
    --gold-dim: #78450a;
    --green: #34d399;
    --green-dim: #065f46;
    --red: #f87171;
    --red-dim: #7f1d1d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 72px;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    padding: 16px 16px 10px;
    position: sticky; top: 0; background: var(--bg); z-index: 5;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; }
  header p { font-size: 11px; color: var(--text-dim); margin: 2px 0 0; }
  main { padding: 12px; max-width: 640px; margin: 0 auto; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
  }
  .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin: 0 0 4px; }
  .stat-value { font-size: 19px; font-weight: 700; margin: 0; }
  .stat-sub { font-size: 10px; color: var(--text-dim); margin: 3px 0 0; }
  .gold { color: var(--gold); } .green { color: var(--green); } .red { color: var(--red); }
  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); font-weight: 700; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .add-btn { background: none; border: none; color: var(--gold); font-size: 12px; font-weight: 600; padding: 4px; }
  .row { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); gap: 8px; }
  .row:last-child { border-bottom: none; }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-size: 13px; font-weight: 600; }
  .row-meta { font-size: 11px; color: var(--text-dim); }
  .row-amt { font-size: 13px; font-weight: 700; white-space: nowrap; }
  .row-del { background: none; border: none; color: var(--text-dim); font-size: 16px; padding: 4px 6px; }
  .total-row { display: flex; justify-content: space-between; padding-top: 10px; margin-top: 6px; border-top: 1px solid var(--border); font-weight: 700; font-size: 13px; }
  .progress-track { height: 8px; background: #223050; border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
  .ribbon-grid { display: flex; flex-wrap: wrap; gap: 4px; }
  .ribbon { flex: 1 1 44px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  .tab-btn { flex: 1; background: none; border: none; color: var(--text-dim); padding: 10px 4px 8px; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tab-btn.active { color: var(--gold); }
  .tab-btn svg { width: 20px; height: 20px; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .toggle-group { display: flex; background: #223050; border-radius: 8px; padding: 2px; }
  .toggle-btn { flex: 1; border: none; background: none; color: var(--text-dim); padding: 6px; font-size: 12px; border-radius: 6px; font-weight: 600; }
  .toggle-btn.active { background: var(--gold); color: #4a2c02; }
  input[type=text], input[type=number] {
    background: #223050; border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; width: 100%;
  }
  .field-label { font-size: 11px; color: var(--text-dim); margin-bottom: 3px; display: block; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; z-index: 20; }
  .modal { background: var(--card); border-radius: 16px 16px 0 0; padding: 18px; width: 100%; max-height: 80vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 14px; font-size: 15px; }
  .modal-field { margin-bottom: 12px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .btn { flex: 1; padding: 11px; border-radius: 8px; border: none; font-size: 14px; font-weight: 700; }
  .btn-primary { background: var(--gold); color: #4a2c02; }
  .btn-secondary { background: #223050; color: var(--text); }
  .extra-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .empty { font-size: 12px; color: var(--text-dim); padding: 10px 0; }
  footer { text-align: center; font-size: 10px; color: var(--text-dim); padding: 10px 0 4px; }
</style>
</head>
<body>

<header>
  <h1>Finance Command Center</h1>
  <p>Budget · debt payoff · net worth · goals</p>
</header>

<main id="app"></main>

<nav class="tabs">
  <button class="tab-btn active" data-tab="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
    Dashboard
  </button>
  <button class="tab-btn" data-tab="budget">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v16"/></svg>
    Budget
  </button>
  <button class="tab-btn" data-tab="debts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
    Debts
  </button>
  <button class="tab-btn" data-tab="networth">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
    Net worth
  </button>
  <button class="tab-btn" data-tab="goals">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
    Goals
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
