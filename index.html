<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Finance Command Center</title>
<meta name="theme-color" content="#0c1a2c" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root {
    --bg: #0c1a2c;
    --card: #12243b;
    --surface: #1a3150;
    --border: #233d5e;
    --text: #f3efe6;
    --text-dim: #9caac0;
    --gold: #dcaa45;
    --gold-dim: #4a3a17;
    --gold-text: #231a05;
    --green: #4fc192;
    --green-dim: #153f33;
    --red: #e05a70;
    --red-dim: #4a1a26;
    --blue: #6fa4e6;
    --num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 80px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.35;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
    font-variant-numeric: tabular-nums;
  }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  header {
    padding: calc(14px + env(safe-area-inset-top)) 18px 12px;
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    border-bottom: 2px solid var(--gold);
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  header h1 { font-family: var(--num); font-size: 24px; margin: 0; font-weight: 700; letter-spacing: 0.01em; }
  #hdr-date { font-size: 15px; color: var(--text-dim); white-space: nowrap; }
  main { padding: 14px 12px; max-width: 640px; margin: 0 auto; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 12px;
  }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stats-grid .card { margin-bottom: 0; }
  .card.stat { padding: 12px 14px; }
  .card.stat.wide { grid-column: 1 / -1; }
  .stat-label { font-size: 14px; color: var(--text-dim); margin: 0 0 2px; }
  .stat-value { font-family: var(--num); font-size: 30px; font-weight: 700; margin: 0; line-height: 1.1; }
  .stat-sub { font-size: 14px; color: var(--text-dim); margin: 4px 0 0; }
  .gold { color: var(--gold); } .green { color: var(--green); } .red { color: var(--red); }

  .section-title { font-size: 18px; font-weight: 700; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .section-note { font-size: 14px; font-weight: 500; color: var(--text-dim); }
  .add-btn { background: var(--gold-dim); border: none; color: var(--gold); font-size: 15px; font-weight: 700; padding: 6px 12px; border-radius: 999px; }

  .row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 10px; }
  .row:last-child { border-bottom: none; }
  .row-main { flex: 1; min-width: 0; cursor: pointer; }
  .row-name { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
  .row-meta { font-size: 14px; color: var(--text-dim); }
  .row-amt { font-family: var(--num); font-size: 21px; font-weight: 600; white-space: nowrap; }
  .row-del { background: none; border: none; color: var(--text-dim); font-size: 22px; padding: 4px 6px; line-height: 1; }
  .total-row { display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; margin-top: 4px; border-top: 2px solid var(--border); font-weight: 700; font-size: 16px; }
  .total-row span:last-child { font-family: var(--num); font-size: 22px; color: var(--gold); }
  .empty { font-size: 15px; color: var(--text-dim); padding: 10px 0; }

  .progress-track { height: 8px; background: var(--surface); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }

  /* Dashboard hero: the month at a glance */
  .card.hero { cursor: pointer; padding: 16px 16px 12px; border-color: #2c4b70; background: linear-gradient(180deg, #15294a, var(--card)); }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; }
  .hero-label { margin: 0; font-size: 15px; color: var(--text-dim); }
  .hero-value { margin: 0; font-family: var(--num); font-size: 44px; font-weight: 700; line-height: 1; color: var(--gold); }
  .hero-count { text-align: right; display: flex; flex-direction: column; }
  .hero-count b { font-family: var(--num); font-size: 30px; line-height: 1; }
  .hero-count span { font-size: 14px; color: var(--text-dim); }
  .strip { display: flex; align-items: flex-end; gap: 2px; height: 72px; border-bottom: 1px solid var(--border); }
  .strip-col { flex: 1; height: 100%; display: flex; align-items: flex-end; position: relative; }
  .strip-bar { width: 100%; border-radius: 3px 3px 0 0; }
  .strip-bar.none { height: 3px; background: var(--surface); border-radius: 2px; }
  .strip-bar.due { background: var(--gold); }
  .strip-bar.late { background: var(--red); }
  .strip-bar.done { background: var(--green); opacity: 0.55; }
  .strip-col.is-today::after { content: ""; position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); border: 5px solid transparent; border-bottom-color: var(--text); }
  .strip-ticks { position: relative; height: 18px; margin-top: 8px; font-size: 12px; color: var(--text-dim); }
  .strip-ticks span { position: absolute; transform: translateX(-50%); }
  .hero-foot { margin: 6px 0 0; font-size: 14px; color: var(--text-dim); }

  .ribbon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
  .ribbon { border-radius: 8px; padding: 7px 8px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .ribbon-pct { font-family: var(--num); font-size: 20px; font-weight: 700; line-height: 1.1; }
  .ribbon-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.85; }

  .tabs { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #0a1625; border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  .tab-btn { flex: 1; background: none; border: none; color: var(--text-dim); padding: 10px 2px 8px; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; }
  .tab-btn.active { color: var(--gold); }
  .tab-btn.active::before { content: ""; position: absolute; top: -1px; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--gold); }
  .tab-btn svg { width: 22px; height: 22px; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .toggle-group { display: flex; background: var(--surface); border-radius: 10px; padding: 3px; }
  .toggle-btn { flex: 1; border: none; background: none; color: var(--text-dim); padding: 8px; font-size: 15px; border-radius: 8px; font-weight: 700; }
  .toggle-btn.active { background: var(--gold); color: var(--gold-text); }
  input[type=text], input[type=number], select {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 10px; font-size: 17px; width: 100%; font-family: inherit;
  }
  .field-label { font-size: 14px; color: var(--text-dim); margin-bottom: 4px; display: block; }
  .extra-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(4, 10, 20, 0.7); display: flex; align-items: flex-end; z-index: 20; }
  .modal { background: var(--card); border-top: 2px solid var(--gold); border-radius: 18px 18px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); width: 100%; max-width: 640px; margin: 0 auto; max-height: 85vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 14px; font-size: 20px; }
  .modal-field { margin-bottom: 12px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 17px; font-weight: 700; }
  .btn-primary { background: var(--gold); color: var(--gold-text); }
  .btn-secondary { background: var(--surface); color: var(--text); }
  .settings-block { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .settings-block .extra-row { margin-bottom: 8px; }
  .nav-progress { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  footer { text-align: center; font-size: 13px; color: var(--text-dim); padding: 10px 0 4px; }

  /* Calendar */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav-btns { display: flex; align-items: center; gap: 6px; }
  .cal-nav button { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; width: 36px; height: 36px; font-size: 20px; line-height: 1; }
  .cal-nav .cal-today-btn { width: auto; padding: 0 12px; font-size: 15px; font-weight: 700; color: var(--gold); }
  .cal-month-label { font-family: var(--num); font-size: 26px; font-weight: 700; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--text-dim); margin-bottom: 10px; }
  .cal-legend span { display: flex; align-items: center; gap: 6px; }
  .cal-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
  .cal-dot.due { background: var(--gold); }
  .cal-dot.late { background: var(--red); }
  .cal-dot.done { background: var(--green); }
  .cal-dot.pay { background: var(--green); width: 14px; height: 3px; border-radius: 2px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 12px; color: var(--text-dim); padding-bottom: 4px; font-weight: 600; }
  .cal-day { position: relative; background: var(--surface); border-radius: 8px; min-height: 54px; padding: 4px 5px; border: 1px solid transparent; }
  .cal-day.empty { background: transparent; }
  .cal-day.today { border-color: var(--gold); }
  .cal-day.selected { border-color: var(--text); }
  .cal-day.has-events { cursor: pointer; }
  .cal-day-num { font-size: 13px; color: var(--text-dim); font-weight: 600; }
  .cal-day.today .cal-day-num { color: var(--gold); }
  .cal-badge { margin-top: 4px; font-family: var(--num); font-size: 16px; font-weight: 700; border-radius: 6px; text-align: center; line-height: 1.3; }
  .cal-badge.due { background: var(--gold-dim); color: var(--gold); }
  .cal-badge.late { background: var(--red-dim); color: var(--red); }
  .cal-badge.done { background: var(--green-dim); color: var(--green); }
  .cal-pay { position: absolute; left: 5px; right: 5px; bottom: 3px; height: 3px; border-radius: 2px; background: var(--green); }
  .cal-group { scroll-margin-top: 90px; }
  .cal-group-head { display: flex; justify-content: space-between; font-size: 14px; color: var(--text-dim); font-weight: 700; padding: 14px 0 2px; border-bottom: 1px solid var(--border); }
  .cal-group-head span:last-child { font-family: var(--num); font-size: 17px; }
  .cal-group.selected .cal-group-head { color: var(--gold); border-bottom-color: var(--gold); }
  .chk { width: 32px; height: 32px; flex-shrink: 0; border-radius: 9px; border: 2px solid #3d5a80; background: transparent; color: #062a1d; font-size: 18px; font-weight: 900; padding: 0; display: flex; align-items: center; justify-content: center; }
  .chk.on { background: var(--green); border-color: var(--green); }
  .bill-row { gap: 12px; }
  .bill-row.paid .row-name { text-decoration: line-through; color: var(--text-dim); }
  .bill-row.paid .row-amt { color: var(--text-dim); }
  .bill-row.late .row-meta { color: var(--red); font-weight: 600; }
  .pay-mark { width: 32px; height: 32px; flex-shrink: 0; border-radius: 9px; background: var(--green-dim); color: var(--green); font-weight: 800; display: flex; align-items: center; justify-content: center; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header>
  <h1>Finance Command Center</h1>
  <span id="hdr-date"></span>
</header>

<main id="app"></main>

<nav class="tabs">
  <button class="tab-btn active" data-tab="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
    Dashboard
  </button>
  <button class="tab-btn" data-tab="budget">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v16"/></svg>
    Budget
  </button>
  <button class="tab-btn" data-tab="debts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
    Debts
  </button>
  <button class="tab-btn" data-tab="networth">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
    Net worth
  </button>
  <button class="tab-btn" data-tab="goals">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
    Goals
  </button>
  <button class="tab-btn" data-tab="calendar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Calendar
  </button>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
